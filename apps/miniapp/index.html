<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <title>Домовой</title>
    <style>
      .no-script {
        margin: 0;
        padding: 24px 16px;
        font: 1rem/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .no-script h1 {
        font-size: 1.25rem;
      }

      .no-script a {
        font-size: 1.25rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Пустая страница без единого слова не говорит человеку ничего, а авария
      ждать не может. Телефон дома приходит с сервера и здесь недоступен,
      поэтому названы номера, которые работают в любом доме.
    -->
    <noscript>
      <div class="no-script">
        <h1>Домовой не запустился</h1>
        <p>Приложению нужен включённый JavaScript. Откройте «Домового» в приложении MAX.</p>
        <p>Если в доме авария, звоните, не дожидаясь приложения:</p>
        <ul>
          <li>Единая служба спасения: <a href="tel:112">112</a></li>
          <li>Аварийная газовая служба: <a href="tel:104">104</a></li>
        </ul>
        <p>Телефон аварийной службы вашей управляющей компании напечатан в квитанции.</p>
      </div>
    </noscript>

    <!--
      Клиент мог сохранить страницу прошлой сборки: ссылки в ней ведут на файлы,
      которых после выкладки уже нет, и человек видит пустой экран. Если через
      несколько секунд на странице по-прежнему ничего, она перечитывается один раз.
    -->
    <script>
      (function () {
        var once = 'domovoy:reloaded';

        setTimeout(function () {
          var root = document.getElementById('root');

          if (!root || root.childElementCount > 0) return;

          try {
            if (sessionStorage.getItem(once)) return;
            sessionStorage.setItem(once, '1');
          } catch (error) {
            return;
          }

          var fresh = new URL(location.href);

          fresh.searchParams.set('v', String(Date.now()));
          location.replace(fresh.toString());
        }, 5000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
