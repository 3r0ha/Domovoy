# DATA-API 1.0: обязательные проверки API «Домового».
# Формат и валидатор: https://gitverse.ru/stasnorman/example-data-api
#
# Вход. Закрытые маршруты ждут заголовок Authorization: Bearer <токен>. Токен
# выдаёт POST /auth/session в обмен на параметры запуска, подписанные токеном
# бота MAX (заголовок x-max-init-data). Токен живёт 12 часов. Выпустить токен
# для роли из репозитория:
#   BOT_TOKEN=<токен бота> API_URL=https://domovoy.homes node scripts/token.mjs <maxUserId> <имя>
# Токены и токен бота в этом файле не хранятся, они передаются по каналу проверки.
#
# Роли. Учётные записи заводит `npm run seed --workspace @domovoy/server`,
# роль задаётся идентификатором пользователя MAX:
#   public      без токена
#   resident    1001, Мария: жилец, квартира 1 в доме Д15
#   neighbor    1002, Иван: жилец, квартира 2 в доме Д15
#   dispatcher  2001, Ольга Титова: диспетчер дома Д15
#   technician  2002, Сергей Малых: мастер
#   contractor  2004, Лифтсервис: подрядчик, видит только порученные наряды
#
# Проверки идут в этом порядке. Основной сценарий заводит заявку жильца и ведёт
# её до принятой работы. Весь прогон повторяется по той же установке:
# `npm run check-api` выполняет его вместе с очисткой.

schemaVersion: "1.0"

solution:
  name: "Домовой"
  teamId: "antihype"

api:
  baseUrl: "https://domovoy.homes"
  # Собирается командой `npm run openapi` по схемам сервера, отдаётся на GET /openapi.json.
  openapi: "./openapi.json"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Сервер отвечает"
    method: "GET"
    path: "/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status", "storage"]
    timeoutMs: 5000
    repeatable: true

  - id: "session-unsigned"
    name: "Вход без подписи MAX не выдаёт токен"
    method: "POST"
    path: "/auth/session"
    role: "public"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields: ["error", "message"]
    timeoutMs: 5000
    repeatable: true

  - id: "me"
    name: "Профиль и роль"
    method: "GET"
    path: "/api/me"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "displayName", "role", "apartmentId"]
    timeoutMs: 5000
    repeatable: true

  - id: "me-unauthorized"
    name: "Без токена профиль не отдаётся"
    method: "GET"
    path: "/api/me"
    role: "public"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields: ["error", "message"]
    timeoutMs: 5000
    repeatable: true

  - id: "create-request"
    name: "Заявка заводится описанием проблемы"
    description: >-
      Описание не поднимает весь стояк: о поломке общего имущества продукт
      спрашивает соседей, и на каждом прогоне им приходил бы вопрос.
    method: "POST"
    path: "/api/requests"
    role: "resident"
    request:
      headers:
        Content-Type: "application/json"
      body:
        description: "Не вывезли мусор от подъезда"
        startParam: "apt_apt-1"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["joined", "request"]
      bodySchema:
        type: "object"
        required: ["joined", "request"]
        properties:
          request:
            type: "object"
            required: ["id", "number", "status", "title", "category", "resolutionDueAt"]
    timeoutMs: 15000
    repeatable: false
    extract:
      requestId: "$.request.id"

  - id: "my-requests"
    name: "Свои заявки списком"
    method: "GET"
    path: "/api/requests"
    role: "resident"
    dependsOn: ["create-request"]
    request:
      query:
        scope: "mine"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        items:
          type: "object"
          required: ["id", "number", "status", "title", "target", "resolutionDueAt", "overdue"]
    timeoutMs: 5000
    repeatable: true

  - id: "request-detail"
    name: "Заявка целиком"
    method: "GET"
    path: "/api/requests/{id}"
    role: "resident"
    dependsOn: ["create-request"]
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "number", "status", "title", "description", "history", "attachments"]
    timeoutMs: 5000
    repeatable: true

  - id: "request-comment"
    name: "Сообщение по заявке"
    method: "POST"
    path: "/api/requests/{id}/comment"
    role: "resident"
    dependsOn: ["create-request"]
    request:
      path:
        id: "${requestId}"
      headers:
        Content-Type: "application/json"
      body:
        text: "Пакеты так и стоят у входа"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "number", "status", "history"]
    timeoutMs: 5000
    repeatable: true

  - id: "request-responsibility"
    name: "Кто отвечает за заявку"
    method: "GET"
    path: "/api/requests/{id}/responsibility"
    role: "resident"
    dependsOn: ["create-request"]
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["kind", "title", "basis", "targets", "handoffs"]
    timeoutMs: 5000
    repeatable: true

  - id: "queue"
    name: "Очередь дома у смены"
    method: "GET"
    path: "/api/requests"
    role: "dispatcher"
    request:
      query:
        scope: "queue"
        limit: 100
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        items:
          type: "object"
          required: ["id", "number", "status", "title", "target"]
    timeoutMs: 5000
    repeatable: true

  - id: "accept"
    name: "Диспетчер принимает заявку в работу"
    method: "POST"
    path: "/api/requests/{id}/transition"
    role: "dispatcher"
    dependsOn: ["create-request"]
    request:
      path:
        id: "${requestId}"
      headers:
        Content-Type: "application/json"
      body:
        to: "accepted"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "status", "history"]
    timeoutMs: 5000
    repeatable: false

  - id: "start-work"
    name: "Мастер берёт наряд в работу"
    method: "POST"
    path: "/api/requests/{id}/transition"
    role: "technician"
    dependsOn: ["accept"]
    request:
      path:
        id: "${requestId}"
      headers:
        Content-Type: "application/json"
      body:
        to: "in_progress"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "status", "history"]
    timeoutMs: 5000
    repeatable: false

  - id: "finish-work"
    name: "Мастер сдаёт работу"
    method: "POST"
    path: "/api/requests/{id}/transition"
    role: "technician"
    dependsOn: ["start-work"]
    request:
      path:
        id: "${requestId}"
      headers:
        Content-Type: "application/json"
      body:
        to: "done"
        comment: "Мусор вывезли, площадку убрали"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "status", "history"]
    timeoutMs: 5000
    repeatable: false

  - id: "confirm-work"
    name: "Жилец принимает работу"
    method: "POST"
    path: "/api/requests/{id}/transition"
    role: "resident"
    dependsOn: ["finish-work"]
    request:
      path:
        id: "${requestId}"
      headers:
        Content-Type: "application/json"
      body:
        to: "confirmed"
        rating: 5
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "status", "history"]
    timeoutMs: 5000
    repeatable: false

  - id: "complaint-without-grounds"
    name: "Обращение в надзор без основания не уходит"
    description: >-
      Обращение в жилищную инспекцию уходит только по основанию: нарушенный срок
      реакции или срок выполнения, превышенный вдвое. У заявки сценария сроки
      соблюдены, поэтому отправка отклоняется.
    method: "POST"
    path: "/api/requests/{id}/complaint"
    role: "resident"
    dependsOn: ["create-request"]
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [409]
      contentType: "application/json"
      requiredFields: ["error", "message"]
    timeoutMs: 5000
    repeatable: true

  - id: "contractor-orders"
    name: "Наряды подрядчика"
    method: "GET"
    path: "/api/requests"
    role: "contractor"
    request:
      query:
        scope: "mine"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        items:
          type: "object"
          required: ["id", "number", "status", "title", "target"]
    timeoutMs: 5000
    repeatable: true

  - id: "neighbor-request"
    name: "Сосед заводит заявку о своей квартире"
    description: "Заявка нужна следующей проверке и отзывается при очистке."
    method: "POST"
    path: "/api/requests"
    role: "neighbor"
    request:
      headers:
        Content-Type: "application/json"
      body:
        description: "Не закрывается балконная дверь"
        startParam: "apt_apt-2"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["joined", "request"]
    timeoutMs: 15000
    repeatable: false
    extract:
      foreignId: "$.request.id"

  - id: "foreign-request-forbidden"
    name: "Чужая квартирная заявка не отдаётся"
    description: "Заявку по общему имуществу видит весь дом, закрыта именно чужая квартирная."
    method: "GET"
    path: "/api/requests/{id}"
    role: "resident"
    dependsOn: ["neighbor-request"]
    request:
      path:
        id: "${foreignId}"
    expected:
      statusCodes: [403]
      contentType: "application/json"
      requiredFields: ["error", "message"]
    timeoutMs: 5000
    repeatable: true

  - id: "handoffs"
    name: "Переданные обращения дома"
    method: "GET"
    path: "/api/handoffs"
    role: "dispatcher"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        items:
          type: "object"
          required: ["id", "requestId", "organization", "status", "dueAt", "basis"]
    timeoutMs: 5000
    repeatable: true

  - id: "meters"
    name: "Счётчики квартиры"
    method: "GET"
    path: "/api/meters"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
        items:
          type: "object"
          required: ["id", "kind", "title", "unit", "serial", "submittedThisMonth", "verification"]
    timeoutMs: 5000
    repeatable: true
    extract:
      meterId: "$[0].id"

  - id: "meter-reading"
    name: "Показание счётчика"
    description: >-
      Показание за расчётный период принимается один раз: повторный прогон в том
      же периоде получает 409 reading_duplicate, это тоже правильный ответ.
    method: "POST"
    path: "/api/meters/{id}/readings"
    role: "resident"
    dependsOn: ["meters"]
    request:
      path:
        id: "${meterId}"
      headers:
        Content-Type: "application/json"
      body:
        value: 152.4
    expected:
      statusCodes: [201, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true

  - id: "charges"
    name: "Квитанция за месяц"
    method: "GET"
    path: "/api/charges"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["period", "dueDay", "total", "paid", "lines"]
    timeoutMs: 5000
    repeatable: true

  - id: "announcements"
    name: "Объявления дома"
    method: "GET"
    path: "/api/announcements"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        items:
          type: "object"
          required: ["id", "title", "body", "createdAt", "audience", "recipients"]
    timeoutMs: 5000
    repeatable: true

  - id: "reception"
    name: "Часы приёма и своя запись"
    method: "GET"
    path: "/api/reception"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["buildingId", "minutes", "hours", "slots"]
    timeoutMs: 5000
    repeatable: true

  - id: "house-contacts"
    name: "К кому обращаться по дому"
    method: "GET"
    path: "/api/house/contacts"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["buildingId", "address"]
    timeoutMs: 5000
    repeatable: true

  - id: "polls"
    name: "Собрания собственников"
    method: "GET"
    path: "/api/polls"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        items:
          type: "object"
          required: ["id", "title", "question", "opensAt", "closesAt", "open"]
    timeoutMs: 5000
    repeatable: true

  - id: "capital-repair"
    name: "Капитальный ремонт дома"
    description: "Без подключённой региональной программы раздел пуст, но список работ в ответе есть всегда."
    method: "GET"
    path: "/api/capital-repair"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["works"]
    timeoutMs: 5000
    repeatable: true

  - id: "handover-forbidden"
    name: "Дом передаёт только управляющий"
    method: "POST"
    path: "/api/buildings/handover"
    role: "resident"
    request:
      headers:
        Content-Type: "application/json"
      body:
        company: "ООО «Новая управляющая»"
        managerId: "res-maria"
        confirm: true
    expected:
      statusCodes: [403]
      contentType: "application/json"
      requiredFields: ["error", "message"]
    timeoutMs: 5000
    repeatable: true

  - id: "assistant"
    name: "Помощник отвечает и называет раздел"
    method: "POST"
    path: "/api/assistant"
    role: "resident"
    request:
      headers:
        Content-Type: "application/json"
      body:
        question: "Где передать показания?"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["answer", "by"]
    timeoutMs: 30000
    repeatable: true

  - id: "legal"
    name: "Документы продукта открыты без входа"
    description: "Политику обработки персональных данных оператор публикует без ограничений, ч. 2 ст. 18.1 152-ФЗ."
    method: "GET"
    path: "/api/legal"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["version", "documents"]
    timeoutMs: 5000
    repeatable: true

  - id: "legal-accept"
    name: "Согласие с документами принимается"
    method: "POST"
    path: "/api/me/legal"
    role: "resident"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["version", "accepted"]
    timeoutMs: 5000
    repeatable: true

cleanup:
  - id: "withdraw-neighbor-request"
    method: "POST"
    path: "/api/requests/{id}/transition"
    role: "neighbor"
    request:
      path:
        id: "${foreignId}"
      headers:
        Content-Type: "application/json"
      body:
        to: "withdrawn"
    expected:
      statusCodes: [200, 409]
    timeoutMs: 5000
